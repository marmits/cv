name: Build CV

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build HTML and PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Cache Puppeteer browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-node26-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-node26-

      # Les package-lock.json résolvent le thème public en SSH ; force HTTPS sans clé privée.
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci

      - name: Check dependency tree
        run: npm ls

      - name: Security audit
        run: npm audit

      - name: Test
        run: npm test

      - name: Build CV
        run: npm run build

      - name: Prepare Pages artifact
        run: mkdir -p dist && cp index.html resume.pdf resume.json dist/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
